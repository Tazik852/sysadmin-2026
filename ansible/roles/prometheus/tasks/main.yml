---
- name: Устанавливаем Prometheus
  apt:
    name: prometheus
    state: present
    update_cache: yes
    cache_valid_time: 3600
  register: apt_prom
  until: apt_prom is succeeded
  retries: 5
  delay: 5

- name: Копируем конфиг Prometheus
  copy:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'nodes'
          static_configs:
            - targets: ['ctrl:9100', 'node1:9100', 'node2:9100', 'mon:9100']
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: Restart prometheus

- name: Запускаем Prometheus
  systemd:
    name: prometheus
    state: started
    enabled: yes
