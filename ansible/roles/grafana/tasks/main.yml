---
- name: Устанавливаем зависимости
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - adduser
      - libfontconfig1
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Скачиваем .deb пакет Grafana
  get_url:
    url: https://dl.grafana.com/oss/release/grafana_11.5.2_amd64.deb
    dest: /tmp/grafana.deb
    mode: '0644'
    timeout: 600
    force: no
  register: download_grafana
  until: download_grafana is succeeded
  retries: 3
  delay: 10

- name: Устанавливаем Grafana из .deb пакета
  apt:
    deb: /tmp/grafana.deb
  when: download_grafana is succeeded
  register: install_grafana

- name: Настраиваем Grafana на прослушивание всех интерфейсов
  lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?http_addr ='
    line: 'http_addr = 0.0.0.0'
  notify: Restart grafana

- name: Создаем директорию для provisioning
  file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: grafana
    mode: '0755'

- name: Добавляем Prometheus как источник данных
  copy:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://localhost:9090
          isDefault: true
          editable: false
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart grafana

- name: Устанавливаем пароль администратора
  lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?admin_password ='
    line: "admin_password = {{ grafana_admin_password }}"
  notify: Restart grafana

- name: Запускаем Grafana
  systemd:
    name: grafana-server
    state: started
    enabled: yes
